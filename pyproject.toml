[project]
name = "email-classification-with-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.19",
    "ollama>=0.6.3",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
email-classification-with-llm = "email_classification_with_llm:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
